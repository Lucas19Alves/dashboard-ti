<!doctype html>
<!-- Imagem de compartilhamento (WhatsApp, redes, buscadores): 1200x630.
     Gerar de novo com: node scripts/gerar-imagem-compartilhar.mjs -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; font-weight: 400; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 500; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 600; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 700; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-700-normal.woff2); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Plex, sans-serif; color: #fff;
    background:
      radial-gradient(900px 520px at 100% 0%, rgba(29, 78, 216, 0.55), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(101, 176, 115, 0.18), transparent 70%),
      #0d1a36;
    display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center;
    padding: 0 72px;
  }
  .marca { display: flex; align-items: center; gap: 22px; }
  .marca img { width: 92px; height: 92px; }
  .marca span { font-size: 26px; font-weight: 600; color: #b9c8ea; letter-spacing: 0.01em; }
  h1 { margin-top: 30px; font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: -0.025em; }
  .frase { margin-top: 22px; font-size: 32px; line-height: 1.3; color: #d5def2; font-weight: 500; max-width: 600px; }
  .temas { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }
  .temas span { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16); font-size: 22px; font-weight: 600; color: #e6ecf8; }

  .painel { background: #f4f6fa; color: #14213d; border-radius: 26px; padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.45); display: grid; gap: 16px; }
  .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border: 1px solid #e2e7ef; border-radius: 16px; padding: 16px 18px; }
  .rotulo { font-size: 15px; font-weight: 600; color: #5b6a82; }
  .valor { margin-top: 4px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .ok { color: #15803d; } .alerta { color: #b45309; }
  .barra { margin-top: 10px; height: 8px; border-radius: 99px; background: #e2e7ef; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; }
  .grafico svg { display: block; width: 100%; height: 120px; margin-top: 8px; }
  .lista { display: grid; gap: 9px; margin-top: 8px; }
  .lista div { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
  .lista b { font-weight: 700; color: #1d4ed8; }
</style>
</head>
<body>
  <main>
    <div class="marca"><img src="../public/favicon.png" alt=""><span>dashboard-ti-five.vercel.app</span></div>
    <h1>Dashboard Loja</h1>
    <p class="frase">Auditorias, vencimentos e estoque da loja em um só painel.</p>
    <div class="temas"><span>Auditorias</span><span>Vencimentos</span><span>Estoque</span></div>
  </main>

  <aside class="painel" aria-hidden="true">
    <div class="linha">
      <div class="card">
        <p class="rotulo">Auditoria do dia</p>
        <p class="valor ok">92%</p>
        <div class="barra"><i style="width:92%;background:#16a34a"></i></div>
      </div>
      <div class="card">
        <p class="rotulo">Vencendo em 3 dias</p>
        <p class="valor alerta">37</p>
        <div class="barra"><i style="width:38%;background:#f59e0b"></i></div>
      </div>
    </div>
    <div class="card grafico">
      <p class="rotulo">Andamento por horário</p>
      <svg viewBox="0 0 400 120" preserveAspectRatio="none">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9fd0" stop-opacity="0.35"/><stop offset="1" stop-color="#4f9fd0" stop-opacity="0"/></linearGradient>
          <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f9fd0"/><stop offset="1" stop-color="#65b073"/></linearGradient>
        </defs>
        <line x1="0" y1="30" x2="400" y2="30" stroke="#e2e7ef" stroke-dasharray="5 5"/>
        <path d="M0 112 C40 104 60 92 100 84 S160 70 200 56 S270 44 300 34 S370 18 400 12 L400 120 L0 120 Z" fill="url(#g)"/>
        <path d="M0 112 C40 104 60 92 100 84 S160 70 200 56 S270 44 300 34 S370 18 400 12" fill="none" stroke="url(#l)" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card">
      <p class="rotulo">Rupturas por setor</p>
      <div class="lista"><div>Mercearia<b>12</b></div><div>Bebidas<b>8</b></div><div>Limpeza<b>5</b></div></div>
    </div>
  </aside>
</body>
</html>
